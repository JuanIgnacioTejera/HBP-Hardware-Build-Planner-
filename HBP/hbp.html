<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HBP · Hardware Build Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hbp.css" />
</head>
<body>

<!-- ════════════════════════════════
     HEADER
════════════════════════════════ -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <rect x="9" y="9" width="6" height="6"/>
          <line x1="9"  y1="2"  x2="9"  y2="4"/>
          <line x1="15" y1="2"  x2="15" y2="4"/>
          <line x1="9"  y1="20" x2="9"  y2="22"/>
          <line x1="15" y1="20" x2="15" y2="22"/>
          <line x1="20" y1="9"  x2="22" y2="9"/>
          <line x1="20" y1="14" x2="22" y2="14"/>
          <line x1="2"  y1="9"  x2="4"  y2="9"/>
          <line x1="2"  y1="14" x2="4"  y2="14"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>HBP</h1>
        <p>Hardware Build Planner</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="resetBuild()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-5"/>
        </svg>
        Reiniciar
      </button>
    </div>
  </div>
</header>

<!-- ════════════════════════════════
     MAIN LAYOUT
════════════════════════════════ -->
<div class="main">

  <!-- CATÁLOGO -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Catálogo</span>
      <span id="catalog-count" style="font-family:var(--mono);font-size:11px;color:var(--text3)"></span>
    </div>
    <div class="tab-bar" id="tabs"></div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Filtrar componentes..." oninput="renderCatalog()" />
    </div>
    <div class="panel-body">
      <div class="comp-list" id="comp-list"></div>
    </div>
  </div>

  <!-- ÁREA DE CONSTRUCCIÓN -->
  <div class="build-area">
    <div class="build-grid-bg"></div>
    <div class="build-header">
      <div>
        <div class="build-header-title">Área de Construcción</div>
        <div class="build-header-sub" id="build-count">0 de 6 componentes</div>
      </div>
      <div id="build-tier-badge"></div>
    </div>
    <div class="build-slots" id="build-slots"></div>
  </div>

  <!-- EVALUACIÓN -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Evaluación</span>
    </div>
    <div class="panel-body" id="eval-panel"></div>
  </div>

</div>

<!-- Drag ghost -->
<div class="dragging-ghost" id="ghost"></div>

<script src="hbp.js"></script>
</body>
</html>
